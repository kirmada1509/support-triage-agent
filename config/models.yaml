# Per model: how Pydantic AI and LiteLLM name it, capabilities, prices (USD per 1M tokens).
# Prices from the providers' pages; check before quoting costs. The prefix of `pydantic_ai` is the
# provider, which also says which key the model needs (app/models_config.py, PROVIDER_KEYS):
# google (GEMINI_API_KEY), openai (OPENAI_API_KEY), deepseek (DEEPSEEK_API_KEY), openrouter
# (OPENROUTER_API_KEY). To add a model: an entry here, then use its key in roles.yaml.
# `settings` go on every request to that model (Pydantic AI ModelSettings):
#   max_tokens: required. Without it OpenRouter reserves 65536 output tokens per request and
#     refuses the call once the key's credit can't cover that.
#   extra_body.thinking: DeepSeek's thinking mode rejects the forced tool choice Pydantic AI uses
#     for typed output, so it's off for direct DeepSeek calls.
deepseek-flash:
  pydantic_ai: "deepseek:deepseek-flash"
  litellm: "deepseek/deepseek-flash"
  tools: true
  json_output: true
  context_tokens: 1000000
  price: {input: 0.30, cached_input: 0.006, output: 1.20}
  settings: {max_tokens: 4096, extra_body: {thinking: {type: disabled}}}
deepseek-v4-pro:
  pydantic_ai: "deepseek:deepseek-v4-pro"
  litellm: "deepseek/deepseek-v4-pro"
  tools: true
  json_output: true
  context_tokens: 1000000
  price: {input: 1.32, cached_input: 0.044, output: 3.96}
  settings: {max_tokens: 8192, extra_body: {thinking: {type: disabled}}}
gemini-flash-lite:
  pydantic_ai: "google:gemini-3.1-flash-lite"
  litellm: "gemini/gemini-3.1-flash-lite"
  tools: true
  json_output: true
  context_tokens: 1048576
  price: {input: 0.25, cached_input: 0.025, output: 1.50}
  settings: {max_tokens: 4096}
gemini-3.5-flash-lite:
  pydantic_ai: "google:gemini-3.5-flash-lite"
  litellm: "gemini/gemini-3.5-flash-lite"
  tools: true
  json_output: true
  context_tokens: 1048576
  price: {input: 0.30, cached_input: 0.03, output: 2.50}
  settings: {max_tokens: 4096}
gemini-3.8-flash:
  pydantic_ai: "google:gemini-3.8-flash"
  litellm: "gemini/gemini-3.8-flash"
  tools: true
  json_output: true
  context_tokens: 1048576
  price: {input: 0.75, cached_input: 0.075, output: 3.75}
  settings: {max_tokens: 8192}             # it thinks first, and thinking counts against the cap
