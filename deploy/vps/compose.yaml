# The agent's Postgres and API on the VPS (deploy/vps/deploy.sh runs it). The worker runs on
# the host instead (triage-worker.service), because the analysts start their own containers and
# mount the fork by host path.
#   docker compose -f deploy/vps/compose.yaml up --detach --build
name: support-triage-agent

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/vps/.env}
      POSTGRES_DB: triage
    # localhost for the worker and scripts; the docker0 bridge for HolmesGPT's history queries
    # (holmes.py sends them to host.docker.internal, which is 172.17.0.1 on Linux). Nothing
    # public: Docker publishes past ufw.
    ports:
      - "127.0.0.1:5433:5432"
      - "172.17.0.1:5433:5432"
    volumes:
      - triage-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage"]
      interval: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # Not called `api`: voice-runtime's API already answers to that name on the shared network.
  triage-api:
    build:
      context: ../..
    image: support-triage-agent:latest
    container_name: support-triage-api
    command: .venv/bin/uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    env_file: ../../.env.agent
    environment:
      DATABASE_URL: postgresql://triage:${POSTGRES_PASSWORD}@db:5432/triage
    networks: [default, edge]
    depends_on:
      db: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped

volumes:
  triage-db:

networks:
  # The shared Caddy (voice-runtime) reaches the API here by container name; no port is published.
  edge:
    name: voice-runtime_default
    external: true
