# The agent's Postgres, API and HTTPS proxy on the VPS (deploy/vps/deploy.sh runs it). The
# worker runs on the host instead (triage-worker.service), because the analysts start their own
# containers and mount the fork by host path.
#   docker compose -f deploy/vps/compose.yaml up --detach --build
name: support-triage-agent

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/vps/.env}
      POSTGRES_DB: triage
    # localhost for the worker and scripts; the docker0 bridge for HolmesGPT's history queries
    # (holmes.py sends them to host.docker.internal, which is 172.17.0.1 on Linux). Nothing
    # public: Docker publishes ports past ufw.
    ports:
      - "127.0.0.1:5433:5432"
      - "172.17.0.1:5433:5432"
    volumes:
      - triage-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage"]
      interval: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  triage-api:
    build:
      context: ../..
    image: support-triage-agent:latest
    command: .venv/bin/uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    env_file: ../../.env.agent
    environment:
      DATABASE_URL: postgresql://triage:${POSTGRES_PASSWORD}@db:5432/triage
    depends_on:
      db: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  # The only public ports on the VPS.
  caddy:
    image: caddy:2.10.2-alpine
    environment:
      DOMAIN: ${DOMAIN:-support-triage-agent.duckdns.org}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [triage-api]
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

volumes:
  triage-db:
  caddy-data:
  caddy-config:
