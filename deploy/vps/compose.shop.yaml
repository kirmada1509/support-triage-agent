# VPS layer for the sandbox shop (copied to sandbox/compose.host.yaml by deploy/vps/deploy.sh).
# The VPS is shared and public: Docker publishes ports past the host firewall, so no shop port
# is published except the frontend proxy on 127.0.0.1:8080 (the scenarios and the worker use
# it). The load generator is off: the scenarios place their own baseline orders.
services:
  ad:
    ports: !reset []
  astronomy-db:
    ports: !reset []
  cart:
    ports: !reset []
  checkout:
    ports: !reset []
  currency:
    ports: !reset []
  email:
    ports: !reset []
  flagd:
    ports: !reset []
  flagd-ui:
    ports: !reset []
  frontend:
    ports: !reset []
  frontend-proxy:
    ports: !override
      - "127.0.0.1:8080:8080"
    depends_on: !override
      frontend:
        condition: service_healthy
      flagd-ui:
        condition: service_healthy
      telemetry-docs:
        condition: service_healthy
  grafana:
    ports: !reset []
  image-provider:
    ports: !reset []
  jaeger:
    ports: !reset []
  load-generator:
    profiles: [loadgen]
    ports: !reset []
  opamp-server:
    ports: !reset []
  opensearch:
    ports: !reset []
  otel-collector:
    ports: !reset []
  payment:
    ports: !reset []
  product-catalog:
    ports: !reset []
  prometheus:
    ports: !reset []
  quote:
    ports: !reset []
  recommendation:
    ports: !reset []
  shipping:
    ports: !reset []
  telemetry-docs:
    ports: !reset []
  valkey-cart:
    ports: !reset []
