[project]
name = "support-triage-agent"
version = "0.1.0"
description = "AI support triage agent: LangGraph pipeline, open-source analysts, live Triage Console"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "psycopg[binary,pool]",
    "procrastinate",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "pydantic-ai-slim[google,openai]",
    "sse-starlette",
    "httpx",
    "pyyaml",
    "python-dotenv>=1.2.3",
    "sqlalchemy[asyncio]>=2.1.1",
    "alembic>=1.20.0",
    "pgvector>=0.5.0",
    "opentelemetry-sdk>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "mini-swe-agent==2.4.6",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.0",  # CPU-only on Linux, see [tool.uv.sources]
    "ast-grep-py==0.45.3",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]
# Added in later phases:
#   HolmesGPT is not a dependency: it runs in its own image (holmes/Dockerfile), because it
#   needs openai<3 and Pydantic AI needs openai 3 (planning/Phase_2_Spike.md).
#   uv add typesafe-sdk                      (phase 4 Jev)

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "db: needs Postgres; run with `make test-db`",
    "sandbox: needs the shop fork (make sandbox); run with `make test-sandbox`",
    "shop: needs the running shop (make shop-up); run with `make test-shop`",
    "llm: real model calls, needs API keys in .env.agent; run with `make test-llm`",
    "spike: HolmesGPT and mini-swe-agent against the running shop; run with `make test-spike`",
    "layer2: Layer 2 demo tickets through the whole graph, live; run with `make test-layer2`",
    "handoff: the analysts' two-way handoff on tickets 4, 8, 9, live; run with `make test-handoff`",
]
addopts = "-m 'not db and not sandbox and not shop and not llm and not spike and not layer2 and not handoff'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"db/migrations/versions/*" = ["E501"]  # autogenerated

[tool.alembic]
# Migrations for our tables (app/tables.py). `make migration m="..."` autogenerates one;
# `make migrate` applies them. The database URL comes from app.settings, not from here.
script_location = "%(here)s/db/migrations"
file_template = "%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

# On Linux (the hosted worker and API images) torch comes from PyTorch's CPU-only index: the
# default wheel pulls ~3 GB of CUDA libraries that the embedding model never uses.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
