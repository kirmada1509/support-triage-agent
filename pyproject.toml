[project]
name = "support-triage-agent"
version = "0.1.0"
description = "AI support triage agent: LangGraph pipeline, open-source analysts, live Triage Console"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "psycopg[binary,pool]",
    "procrastinate",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "pydantic-ai-slim[openai]",
    "sse-starlette",
    "httpx",
    "pyyaml",
    "python-dotenv>=1.2.3",
    "sqlalchemy[asyncio]>=2.1.1",
    "alembic>=1.20.0",
    "pgvector>=0.5.0",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]
# Added in later phases, after the day-4 spike confirms they fit:
#   uv add holmesgpt mini-swe-agent          (phase 2 spike, phase 6 nodes)
#   uv add sentence-transformers             (phase 3 retrieval)
#   uv add typesafe-sdk                      (phase 4 Jev)

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "db: needs Postgres; run with `make test-db`",
    "sandbox: needs the shop fork (make sandbox); run with `make test-sandbox`",
    "shop: needs the running shop (make shop-up); run with `make test-shop`",
]
addopts = "-m 'not db and not sandbox and not shop'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"db/migrations/versions/*" = ["E501"]  # autogenerated

[tool.alembic]
# Migrations for our tables (app/tables.py). `make migration m="..."` autogenerates one;
# `make migrate` applies them. The database URL comes from app.settings, not from here.
script_location = "%(here)s/db/migrations"
file_template = "%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"
