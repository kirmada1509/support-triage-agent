# HolmesGPT toolsets for the data analyst. Only these are enabled; every other built-in toolset
# stays off. Names and config keys are HolmesGPT 0.42.0's (holmes/Dockerfile pins it).
# Hosts are the shop's compose service names: HolmesGPT runs on the shop's network.

toolsets:
  prometheus/metrics:
    enabled: true
    config:
      prometheus_url: http://prometheus:9090

  database/sql:                            # the shop's catalog schema, read-only role
    enabled: true
    config:
      # agent_ro is created by the sandbox's src/postgresql/init.sql (sandbox/patches/v1.3.0)
      connection_url: postgresql://agent_ro:agent_ro_password@astronomy-db:5432/astronomy_db
      read_only: true

  # HolmesGPT enables these by default; the data analyst must only read through the toolsets above
  # (a shell or open internet access would bypass the read-only role and the condensed output).
  bash: {enabled: false}
  internet: {enabled: false}
  connectivity_check: {enabled: false}
  kubectl-run: {enabled: false}
  kubernetes/kube-prometheus-stack: {enabled: false}
  skills: {enabled: false}
  # Its elasticsearch_search takes free-form objects, which DeepSeek's API rejects; `logs` below
  # searches the same OpenSearch with the query as a JSON string, on any provider.
  elasticsearch/data: {enabled: false}

  logs:
    description: "Search the shop's logs in OpenSearch (one index a day, otel-logs-yyyy-MM-dd). Output is condensed: time, service and version, severity, body, exception and its top frame, trace ID."
    tools:
      - name: log_indices
        description: "The log indices and how many records each holds"
        command: |
          curl -s "http://opensearch:9200/_cat/indices/otel-logs-*?h=index,docs.count&s=index"
      - name: search_logs
        description: "Search logs with an OpenSearch request body given as a JSON string, e.g. {\"query\": {\"bool\": {\"must\": [{\"match_phrase\": {\"resource.service.name\": \"payment\"}}, {\"range\": {\"@timestamp\": {\"gte\": \"2026-01-01T10:00:00Z\"}}}]}}, \"sort\": [{\"@timestamp\": \"desc\"}]}. Fields: @timestamp, resource.service.name, resource.service.version, severity.text, body, attributes.exception.message, traceId. aggs work too. At most 50 hits."
        command: python3 /tools/search_logs.py {{ index }} {{ query }}

  jaeger:
    description: "Find and read traces in the shop's Jaeger. Output is condensed: trace ID, duration, root operation, user.id, service.version and the first error."
    tools:
      - name: find_error_traces
        description: "Failed traces for a service and operation in a time window (microsecond epoch timestamps)"
        command: |
          curl -s -G "http://jaeger:16686/jaeger/ui/api/traces" \
            --data-urlencode "service={{ service }}" \
            --data-urlencode "operation={{ operation }}" \
            --data-urlencode 'tags={"error":"true"}' \
            --data-urlencode "start={{ start_us }}" --data-urlencode "end={{ end_us }}" \
            --data-urlencode "limit=20" | python3 /tools/condense_traces.py
      - name: find_traces_for_user
        description: "Traces for one shopper (span attribute user.id) in a time window"
        command: |
          curl -s -G "http://jaeger:16686/jaeger/ui/api/traces" \
            --data-urlencode "service={{ service }}" \
            --data-urlencode 'tags={"user.id":"{{ user_id }}"}' \
            --data-urlencode "start={{ start_us }}" --data-urlencode "end={{ end_us }}" \
            --data-urlencode "limit=20" | python3 /tools/condense_traces.py
      - name: get_trace
        description: "One trace by ID, as a condensed span tree with errors"
        command: |
          curl -s "http://jaeger:16686/jaeger/ui/api/traces/{{ trace_id }}" \
            | python3 /tools/condense_traces.py --tree

  history:
    description: "Deploys and feature-flag changes, from the support agent's own database (read-only)"
    tools:
      - name: deploys
        description: "Deploys since a time (ISO 8601), optionally for one service; with versions, git sha and commit titles"
        command: |
          psql "$HISTORY_DB_URL" -X -v ON_ERROR_STOP=1 -A -F ' | ' \
            -v since={{ since }} -v service={{ service }} -f /tools/history_deploys.sql
      - name: flag_changes
        description: "Feature-flag changes since a time (ISO 8601)"
        command: |
          psql "$HISTORY_DB_URL" -X -v ON_ERROR_STOP=1 -A -F ' | ' \
            -v since={{ since }} -f /tools/history_flag_changes.sql
